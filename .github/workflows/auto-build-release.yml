name: Upstream Sync & Auto Release

on:
  schedule:
    # 每周一北京时间 10:00 自动检查并合并上游更新后构建发布
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      abis:
        description: "ABIs to build (comma-separated, e.g. arm64-v8a or arm64-v8a,armeabi-v7a)"
        type: string
        default: "arm64-v8a"
      feature_branch:
        description: "Feature branch to merge onto upstream/main"
        type: string
        default: "feat/doubao-wetype-ime-asr"

concurrency:
  group: upstream-sync-auto-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Merge Upstream & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream main and merge IME ASR feature
        env:
          FEATURE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.feature_branch || 'feat/doubao-wetype-ime-asr' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/BryceWG/BiBi-Keyboard.git
          else
            git remote add upstream https://github.com/BryceWG/BiBi-Keyboard.git
          fi
          git fetch upstream main
          git fetch origin "$FEATURE_BRANCH"
          # 每次均以最新上游 main 为基线，合入独立功能分支
          git checkout -B release-build upstream/main
          if ! git merge --no-edit "origin/$FEATURE_BRANCH" -m "Merge $FEATURE_BRANCH into upstream/main"; then
            echo "::error::Merge conflict while merging origin/$FEATURE_BRANCH into upstream/main. Conflicting files:"
            git diff --name-only --diff-filter=U
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2
        continue-on-error: true
        timeout-minutes: 2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Configure Release Signing Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 (or RELEASE_KEYSTORE_BASE64) is not set! Configure KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing KEYSTORE_PASSWORD, KEY_ALIAS, or KEY_PASSWORD secret."
            exit 1
          fi
          echo "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -di > "${{ github.workspace }}/release.keystore"
          echo "KEYSTORE_FILE=${{ github.workspace }}/release.keystore" >> "$GITHUB_ENV"
          ls -lh "${{ github.workspace }}/release.keystore"

      - name: Make Gradle wrapper executable
        run: |
          chmod +x ./gradlew || true
          sed -i -e 's/\r$//' ./gradlew || true

      - name: Determine Version Metadata
        id: meta
        run: |
          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          UPSTREAM_HASH=$(git rev-parse --short upstream/main)
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="0.0.0"
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "upstream_hash=$UPSTREAM_HASH" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION_NAME}-ime.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build Signed Release APKs
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SF_FREE_API_KEY: ${{ secrets.SF_FREE_API_KEY }}
          POCKETBASE_BASE_URL: ${{ secrets.POCKETBASE_BASE_URL || vars.POCKETBASE_BASE_URL }}
          ABIS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.abis || 'arm64-v8a' }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          UPSTREAM_HASH: ${{ steps.meta.outputs.upstream_hash }}
        run: |
          mkdir -p release-artifacts
          IFS=',' read -ra ABI_LIST <<< "$ABIS"
          for raw_abi in "${ABI_LIST[@]}"; do
            ABI=$(echo "$raw_abi" | xargs)
            if [ -z "$ABI" ]; then continue; fi
            echo "Building Release APK for ABI: $ABI"
            ./gradlew --no-daemon clean :app:assembleRelease -PabiFilters="$ABI"
            APK_PATH=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | grep -vE 'unaligned|unsigned' | head -n 1 || true)
            if [ -z "$APK_PATH" ]; then
              echo "::error::Signed Release APK not found for $ABI"
              ls -la app/build/outputs/apk/release/ || true
              exit 1
            fi
            OUT_APK="release-artifacts/BiBi-Keyboard-${VERSION_NAME}-${ABI}-${UPSTREAM_HASH}.apk"
            cp "$APK_PATH" "$OUT_APK"
            ls -lh "$OUT_APK"
          done

      - name: Locate Built APKs
        id: locate_apks
        run: |
          APK_FILES=$(find release-artifacts -maxdepth 1 -type f -name "*.apk" | sort)
          if [ -z "$APK_FILES" ]; then
            echo "::error::No APK files produced"
            exit 1
          fi
          {
            echo "apk_paths<<EOF"
            echo "$APK_FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "BiBi-Keyboard ${{ steps.meta.outputs.version_name }} (${{ steps.meta.outputs.upstream_hash }} + IME ASR)"
          body: |
            Automated build syncing upstream `BryceWG/BiBi-Keyboard` (`main`) with Doubao IME & WeType zero-config streaming ASR.

            - **Upstream commit**: `${{ steps.meta.outputs.upstream_hash }}`
            - **Merged branch**: `${{ github.event_name == 'workflow_dispatch' && github.event.inputs.feature_branch || 'feat/doubao-wetype-ime-asr' }}`
            - **Signing**: Consistent release keystore (supports in-place upgrades)
          draft: false
          prerelease: false
          files: ${{ steps.locate_apks.outputs.apk_paths }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
